$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/ssl/garden.connect.pem"
    ssl.ca-file = "/etc/lighttpd/ssl/garden.connect.crt"
    


    ssl.cipher-list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    ssl.honor-cipher-order = "enable"
    ssl.dh-file = "/etc/lighttpd/ssl/dhparams.pem"
    ssl.use-sslv2 = "disable"
    ssl.use-sslv3 = "disable"
    
    server.name = "garden.connect"
    
    server.document-root = "/var/www/html"
    server.stream-response-body = 1
    
    server.modules += ( "mod_proxy", "mod_rewrite" )
    
    index-file.names += ( "index.html" )
    
    $HTTP["url"] =~ "^/(api/|docs|redoc|openapi.json)" {
        proxy.server = ( "" => ( 
            ( 
                "host" => "127.0.0.1", 
                "port" => 8000 
            ) 
        ) )
    }
    
    url.rewrite-once = (
        "^/api/.*" => "$0",
        "^/(docs|redoc|openapi.json)" => "$0",
        "^/.*\.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|json|map|wasm|webmanifest)$" => "$0",
        "^/.*" => "/index.html"
    )
}

# Redirect HTTP to HTTPS
$SERVER["socket"] == ":80" {
    $HTTP["host"] == "garden.connect" {
        url.redirect = (".*" => "https://garden.connect$0")
    }
}
