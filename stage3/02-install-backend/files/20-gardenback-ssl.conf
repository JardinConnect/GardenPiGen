# HTTPS configuration for garden.connect
# Only active if SSL certificates exist
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/ssl/garden.connect.pem"
    ssl.ca-file = "/etc/lighttpd/ssl/garden.connect.crt"
    
    ssl.cipher-list = "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
    ssl.honor-cipher-order = "enable"
    ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.2")
}

# Optional: Only use DH params if file exists
$HTTP["url"] =~ "" {
    var.dh_file = "/etc/lighttpd/ssl/dhparams.pem"
}

# Redirect HTTP to HTTPS for garden.connect
$HTTP["scheme"] == "http" {
    $HTTP["host"] =~ "garden\.connect" {
        url.redirect = (".*" => "https://%0$0")
    }
}
