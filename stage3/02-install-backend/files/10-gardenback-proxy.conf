server.modules += ( "mod_proxy", "mod_rewrite" )

index-file.names = ( "index.html" )

$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => (
        ( "host" => "127.0.0.1", "port" => 8000 )
    ))
    proxy.header = (
        "map-urlpath" => ( "/api/" => "/" ),
        "upgrade" => "enable"
    )
}

$HTTP["url"] =~ "^/(docs|redoc|openapi.json)" {
    proxy.server = ( "" => (
        ( "host" => "127.0.0.1", "port" => 8000 )
    ))
}

url.rewrite-once = (
    "^/api/.*" => "$0",
    "^/(docs|redoc|openapi.json)" => "$0",
    "^/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|json|map)$" => "$0",
    "^/.*" => "/index.html"
)
