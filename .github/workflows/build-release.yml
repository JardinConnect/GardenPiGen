name: Build Pi Image on Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to upload assets to the release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure binfmt support for qemu
        run: |
          sudo docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Make build script executable
        run: chmod +x build-docker.sh

      - name: Build image via Docker
        run: |
          # Optionally: copy or create config file here
          # echo "IMG_NAME='custom-image-name'" > config
          sudo ./build-docker.sh

      - name: Upload image(s) to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
